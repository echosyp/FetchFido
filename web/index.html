<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FetchFido</title>

<!--
  Strict CSP. No CDN, no inline script, no eval. Leaflet is vendored
  (web/vendor/VENDOR.md). 'unsafe-inline' is permitted for style only because
  Leaflet sets inline styles on its own layer elements at runtime.

  connect-src has to admit http: and https: because the WiFi transport talks
  to a node at a LAN address the user types in, and CSP cannot express "any
  private address". This is the weakest directive here and it is a deliberate
  trade for that feature. It can be tightened back to 'self' once the server
  exists and can proxy the node, or by anyone who only uses Bluetooth.
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: https://tile.openstreetmap.org;
  connect-src 'self' http: https:;
  object-src 'none';
  base-uri 'none';
  form-action 'none'">
<!--
  frame-ancestors is deliberately absent: it is ignored when delivered via
  <meta> and must be sent as an HTTP header. The Go server should set it.
-->

<meta name="theme-color" content="#0d1117">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="bar">
  <h1>FetchFido</h1>
  <span id="status" class="status offline">offline</span>
  <span id="geo" class="geo"></span>
  <span id="stats" class="stats"></span>
</header>

<div class="diagbar"><span id="diag" class="diag"></span></div>

<div class="controls">
  <select id="transport" aria-label="Transport">
    <option value="ble">Bluetooth</option>
    <option value="wifi">WiFi</option>
    <option value="serial">USB cable</option>
  </select>
  <input id="address" type="text" inputmode="url" autocomplete="off"
         placeholder="192.168.1.50" aria-label="Node address" hidden>
  <button id="connect">Connect radio</button>
  <button id="fit">Fit all</button>
  <button id="export">Export CSV</button>
  <button id="clear" class="danger">Clear</button>
</div>

<div id="nav" class="nav" hidden>
  <div class="nav-arrow-wrap">
    <svg id="nav-arrow" class="nav-arrow" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M50 6 L78 88 L50 70 L22 88 Z" fill="currentColor"/>
    </svg>
  </div>
  <div class="nav-text">
    <div id="nav-name" class="nav-name"></div>
    <div id="nav-dist" class="nav-dist"></div>
    <div id="nav-bearing" class="nav-bearing"></div>
    <div id="nav-mode" class="nav-mode"></div>
  </div>
  <button id="nav-close" class="nav-close" aria-label="Stop navigating">&times;</button>
</div>

<main>
  <div id="map"></div>
  <aside id="dogs" class="dogs"></aside>
</main>

<script src="vendor/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
